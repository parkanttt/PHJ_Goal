<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>일기 주제 뽑기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dongle&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Dongle', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #f2dfa1, #e6c266, #d9a442);
            display: flex;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 0 60px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            color: #fff;
            opacity: 0.9;
            font-size: 22px;
            text-decoration: none;
            margin-top: 4px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 40px;
            white-space: nowrap;
            margin: 6px 0 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 0 0 18px;
            opacity: 0.9;
            line-height: 1.3;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .chip {
            border: none;
            background: rgba(255, 255, 255, 0.55);
            color: #6b4a00;
            font-size: 22px;
            padding: 4px 14px;
            border-radius: 999px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .chip.active {
            background: #fff;
            color: #4a3200;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 22px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 18px;
            text-align: center;
        }

        .topic-area {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .topic-area.fade {
            opacity: 0;
            transform: translateY(8px);
        }

        .badge {
            display: inline-block;
            font-size: 22px;
            padding: 2px 14px;
            border-radius: 999px;
            color: #fff;
            background: #bbb;
        }

        .topic-text {
            font-size: 38px;
            line-height: 1.15;
            color: #333;
            margin: 0;
            word-break: keep-all;
        }

        .topic-text.placeholder {
            color: #b9a56a;
        }

        button.primary {
            width: 100%;
            border: none;
            background: #dba83c;
            color: #4a3200;
            font-size: 32px;
            padding: 14px 0;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button.primary:active {
            transform: scale(0.97);
            background: #c2932c;
        }

        .sub-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button.ghost {
            flex: 1;
            border: none;
            background: #eee;
            color: #555;
            font-size: 24px;
            padding: 8px 0;
            border-radius: 10px;
            cursor: pointer;
        }

        button.ghost:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .progress {
            text-align: center;
            color: #fff;
            font-size: 22px;
            opacity: 0.95;
            margin: 0;
        }

        .reset-btn {
            display: block;
            margin: 6px auto 0;
            border: none;
            background: none;
            color: #fff;
            opacity: 0.8;
            font-size: 20px;
            text-decoration: underline;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(30px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(20px);
            background: rgba(51, 51, 51, 0.92);
            color: #fff;
            font-size: 24px;
            padding: 8px 18px;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            max-width: calc(100% - 40px);
            text-align: center;
            line-height: 1.2;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="app">
        <a class="back-link" href="index.html">← 메인으로</a>
        <h1>일기 주제 뽑기 📔</h1>
        <p class="subtitle">버튼을 누르면 일기 주제가<br>하나씩 랜덤으로 나와요</p>

        <div class="chips" id="chips"></div>

        <div class="card">
            <div class="topic-area" id="topicArea">
                <span class="badge hidden" id="badge" style="display:none"></span>
                <p class="topic-text placeholder" id="topicText">아래 버튼을 눌러 주제를 뽑아보세요 ✨</p>
            </div>
        </div>

        <button class="primary" id="drawBtn">오늘의 주제 뽑기 🎲</button>
        <div class="sub-actions">
            <button class="ghost" id="redrawBtn" disabled>다시 뽑기 🔀</button>
            <button class="ghost" id="copyBtn" disabled>주제 복사 📋</button>
        </div>

        <p class="progress" id="progress" style="margin-top:18px"></p>
        <button class="reset-btn" id="resetBtn">뽑은 기록 초기화</button>
    </div>
    <div class="toast" id="toast"></div>

    <script src="diary/topics.js"></script>
    <script>
        const TOPICS = window.TOPICS || [];
        const CATEGORIES = ['전체', '목표', '감정', '관계', '일상', '회고', '취미'];
        const COLORS = {
            '목표': '#e07a5f',
            '감정': '#d1798f',
            '관계': '#5f9ea0',
            '일상': '#81a65b',
            '회고': '#8a7bc4',
            '취미': '#d49a2a'
        };
        const STORAGE_KEY = 'diaryTopicSeen_v1';

        const chipsEl = document.getElementById('chips');
        const topicArea = document.getElementById('topicArea');
        const topicText = document.getElementById('topicText');
        const badge = document.getElementById('badge');
        const drawBtn = document.getElementById('drawBtn');
        const redrawBtn = document.getElementById('redrawBtn');
        const copyBtn = document.getElementById('copyBtn');
        const progressEl = document.getElementById('progress');
        const resetBtn = document.getElementById('resetBtn');
        const toastEl = document.getElementById('toast');

        let category = '전체';
        let current = null;
        let seen = new Set();

        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (Array.isArray(saved)) seen = new Set(saved);
        } catch (e) { /* 저장소를 못 쓰면 메모리에서만 동작 */ }

        function saveSeen() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...seen])); } catch (e) { }
        }

        function pool() {
            return TOPICS.filter(t => category === '전체' || t.category === category);
        }

        function updateProgress() {
            const all = pool();
            const done = all.filter(t => seen.has(t.id)).length;
            progressEl.textContent = '📖 ' + done + ' / ' + all.length + ' 개 뽑았어요';
        }

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
        }

        function render(topic) {
            badge.style.display = 'inline-block';
            badge.textContent = topic.category;
            badge.style.background = COLORS[topic.category] || '#bbb';
            topicText.textContent = topic.text;
            topicText.classList.remove('placeholder');
        }

        function draw() {
            const all = pool();
            if (all.length === 0) return;

            let candidates = all.filter(t => !seen.has(t.id));
            if (candidates.length === 0) {
                all.forEach(t => seen.delete(t.id));
                candidates = all.slice();
                toast('모든 주제를 다 봤어요! 다시 시작해요 🔄');
            }
            // 바로 직전 주제가 연속으로 나오지 않게 처리
            if (candidates.length > 1 && current) {
                candidates = candidates.filter(t => t.id !== current.id);
            }

            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            seen.add(pick.id);
            saveSeen();
            current = pick;

            topicArea.classList.add('fade');
            setTimeout(() => {
                render(pick);
                topicArea.classList.remove('fade');
            }, 250);

            redrawBtn.disabled = false;
            copyBtn.disabled = false;
            updateProgress();
        }

        function buildChips() {
            CATEGORIES.forEach(c => {
                const b = document.createElement('button');
                b.className = 'chip' + (c === category ? ' active' : '');
                b.textContent = c;
                b.addEventListener('click', () => {
                    category = c;
                    chipsEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.textContent === c));
                    updateProgress();
                });
                chipsEl.appendChild(b);
            });
        }

        async function copyTopic() {
            if (!current) return;
            const text = '[' + current.category + '] ' + current.text;
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (_) { }
                ta.remove();
            }
            toast('주제를 복사했어요 📋');
        }

        resetBtn.addEventListener('click', () => {
            seen.clear();
            saveSeen();
            updateProgress();
            toast('기록을 초기화했어요');
        });

        drawBtn.addEventListener('click', draw);
        redrawBtn.addEventListener('click', draw);
        copyBtn.addEventListener('click', copyTopic);

        if (TOPICS.length === 0) {
            topicText.textContent = '주제 파일을 불러오지 못했어요 😢';
            drawBtn.disabled = true;
        }
        buildChips();
        updateProgress();
    </script>
</body>

</html>

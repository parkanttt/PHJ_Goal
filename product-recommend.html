<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>박스 뽑기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dongle&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Dongle', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #f2dfa1, #e6c266, #d9a442);
            display: flex;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 0 60px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            color: #fff;
            opacity: 0.9;
            font-size: 22px;
            text-decoration: none;
            margin-top: 4px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 44px;
            margin: 6px 0 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 0 0 20px;
            opacity: 0.9;
            line-height: 1.3;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 18px;
        }

        .upload-box {
            display: block;
            width: 100%;
            border: 3px dashed #d9a442;
            border-radius: 16px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-box:active {
            background: #f7ecc9;
        }

        .upload-box .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
        }

        .upload-box p {
            font-size: 26px;
            color: #a9822f;
            margin: 4px 0 0;
        }

        #fileInput {
            display: none;
        }

        .marker-area {
            position: relative;
            width: 100%;
            margin-top: 14px;
            display: none;
            touch-action: manipulation;
        }

        #preview {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #markersLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .marker {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #c98f2e;
            color: #c98f2e;
            font-weight: bold;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .marker.winner {
            background: #e08a2e;
            border-color: #7a3d10;
            color: #3d1f08;
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 5;
            animation: winnerPulse 0.9s ease-in-out infinite;
        }

        @keyframes winnerPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(224, 138, 46, 0.7);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(224, 138, 46, 0);
            }
        }

        .hint {
            font-size: 20px;
            color: #999;
            text-align: center;
            margin: 10px 0 0;
        }

        .marker-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .marker-count {
            font-size: 24px;
            color: #555;
        }

        button.ghost {
            border: none;
            background: #eee;
            color: #555;
            font-size: 22px;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        button.primary {
            width: 100%;
            border: none;
            background: #dba83c;
            color: #4a3200;
            font-size: 30px;
            padding: 14px 0;
            border-radius: 14px;
            margin-top: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button.primary:active {
            transform: scale(0.97);
            background: #c2932c;
        }

        button.primary:disabled {
            background: #f0dca0;
            color: #b89a4a;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        #resultCard {
            animation: popIn 0.35s ease;
            text-align: center;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-text {
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin: 0 0 12px;
        }

        .footer-note {
            text-align: center;
            color: #fff;
            opacity: 0.85;
            font-size: 20px;
            margin-top: 6px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="app">
        <a class="back-link" href="index.html">← 메인으로</a>
        <h1>박스 뽑기 🎯</h1>
        <p class="subtitle">사진 속 상자를 탭해서 표시하면<br>번호를 매기고 그중 하나를 뽑아드려요</p>

        <div class="card">
            <label class="upload-box" id="uploadBox">
                <span class="icon">📷</span>
                <p id="uploadText">사진 올리기 / 사진첩에서 선택</p>
                <input type="file" id="fileInput" accept="image/*">
            </label>

            <div class="marker-area" id="markerArea">
                <img id="preview" alt="업로드한 사진">
                <div id="markersLayer"></div>
            </div>
            <p class="hint" id="hintText">사진을 눌러 상자 위치를 표시하세요 (표시를 다시 누르면 삭제돼요)</p>

            <div class="marker-controls">
                <span class="marker-count" id="markerCount">0개 표시됨</span>
                <button class="ghost" id="resetBtn">초기화</button>
            </div>

            <button class="primary" id="drawBtn" disabled>뽑기 🎲</button>
        </div>

        <div class="card hidden" id="resultCard">
            <p class="result-text" id="resultText"></p>
            <button class="ghost" id="redrawBtn">다시 뽑기 🔀</button>
        </div>

        <p class="footer-note">* 표시한 순서와 상관없이, 왼쪽 → 오른쪽으로 번호를 매긴 뒤 다음 줄(위→아래)로 자동 정렬돼요.</p>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadText = document.getElementById('uploadText');
        const preview = document.getElementById('preview');
        const markerArea = document.getElementById('markerArea');
        const markersLayer = document.getElementById('markersLayer');
        const hintText = document.getElementById('hintText');
        const markerCount = document.getElementById('markerCount');
        const resetBtn = document.getElementById('resetBtn');
        const drawBtn = document.getElementById('drawBtn');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');
        const redrawBtn = document.getElementById('redrawBtn');

        let markers = [];
        let nextId = 1;
        let rolling = false;

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                markerArea.style.display = 'block';
                uploadText.textContent = '다른 사진으로 바꾸기';
                markers = [];
                nextId = 1;
                renderMarkers();
                updateControls();
                resultCard.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        });

        markerArea.addEventListener('click', (e) => {
            if (rolling) return;
            const rect = markerArea.getBoundingClientRect();
            const xPct = ((e.clientX - rect.left) / rect.width) * 100;
            const yPct = ((e.clientY - rect.top) / rect.height) * 100;
            markers.push({ id: nextId++, xPct, yPct });
            reorderMarkers();
            renderMarkers();
            updateControls();
            resultCard.classList.add('hidden');
        });

        function removeMarker(id) {
            markers = markers.filter(m => m.id !== id);
            reorderMarkers();
            renderMarkers();
            updateControls();
            resultCard.classList.add('hidden');
        }

        // 왼쪽 -> 오른쪽으로 번호를 매기고, 다 채우면 다음 줄(위->아래)로 넘어가도록 정렬
        function reorderMarkers() {
            const sorted = [...markers].sort((a, b) => a.yPct - b.yPct);
            const rowThreshold = 7; // 이미지 높이 대비 %
            const rows = [];
            for (const m of sorted) {
                let row = rows.find(r => Math.abs(r.refY - m.yPct) <= rowThreshold);
                if (!row) {
                    row = { refY: m.yPct, items: [] };
                    rows.push(row);
                }
                row.items.push(m);
                row.refY = row.items.reduce((s, i) => s + i.yPct, 0) / row.items.length;
            }
            rows.sort((a, b) => a.refY - b.refY);

            let n = 1;
            const numbered = [];
            for (const row of rows) {
                row.items.sort((a, b) => a.xPct - b.xPct);
                for (const item of row.items) {
                    item.number = n++;
                    numbered.push(item);
                }
            }
            markers = numbered;
        }

        function renderMarkers() {
            markersLayer.innerHTML = '';
            markers.forEach(m => {
                const el = document.createElement('div');
                el.className = 'marker';
                el.style.left = m.xPct + '%';
                el.style.top = m.yPct + '%';
                el.textContent = m.number;
                el.dataset.id = m.id;
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (rolling) return;
                    removeMarker(m.id);
                });
                markersLayer.appendChild(el);
            });
        }

        function highlightOnly(id) {
            markersLayer.querySelectorAll('.marker').forEach(el => el.classList.remove('winner'));
            const el = markersLayer.querySelector('[data-id="' + id + '"]');
            if (el) el.classList.add('winner');
        }

        function updateControls() {
            markerCount.textContent = markers.length + '개 표시됨';
            drawBtn.disabled = markers.length === 0;
        }

        resetBtn.addEventListener('click', () => {
            if (rolling) return;
            markers = [];
            renderMarkers();
            updateControls();
            resultCard.classList.add('hidden');
        });

        function draw() {
            if (markers.length === 0 || rolling) return;
            rolling = true;
            resultCard.classList.add('hidden');
            let ticks = 0;
            const maxTicks = 14 + Math.floor(Math.random() * 6);
            const interval = setInterval(() => {
                const idx = Math.floor(Math.random() * markers.length);
                highlightOnly(markers[idx].id);
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    const winner = markers[Math.floor(Math.random() * markers.length)];
                    highlightOnly(winner.id);
                    resultText.textContent = '🎉 ' + winner.number + '번 상자를 골랐어요!';
                    resultCard.classList.remove('hidden');
                    rolling = false;
                }
            }, 90);
        }

        drawBtn.addEventListener('click', draw);
        redrawBtn.addEventListener('click', draw);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Today's Gacha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dongle&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Dongle', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #f2dfa1, #e6c266, #d9a442);
            display: flex;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 0 60px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 0;
        }

        .profile-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #fff;
            font-size: 48px;
            margin: 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .subtitle {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin: 0 0 24px;
            opacity: 0.9;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item:active {
            transform: scale(0.97);
        }

        .menu-icon {
            font-size: 40px;
            flex-shrink: 0;
        }

        .menu-text {
            flex: 1;
        }

        .menu-title {
            font-size: 30px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .menu-desc {
            font-size: 22px;
            color: #999;
            margin: 2px 0 0;
        }

        .menu-arrow {
            font-size: 26px;
            color: #e0c17a;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="title-row">
            <img class="profile-img" src="https://github.com/parkanttt.png" alt="parkanttt">
            <h1>Today's Gacha</h1>
        </div>
        <p class="subtitle">하고 싶은 기능을 선택하세요</p>

        <div class="menu-list">
            <a class="menu-item" href="product-recommend.html">
                <span class="menu-icon">🎯</span>
                <span class="menu-text">
                    <p class="menu-title">박스 뽑기</p>
                    <p class="menu-desc">사진 속 상자를 표시하고 랜덤으로 하나를 뽑아요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>
            <a class="menu-item" href="text-pick.html">
                <span class="menu-icon">📝</span>
                <span class="menu-text">
                    <p class="menu-title">텍스트 뽑기</p>
                    <p class="menu-desc">항목을 여러 개 입력하고 랜덤으로 하나를 뽑아요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>
        </div>
    </div>
</body>

</html>
